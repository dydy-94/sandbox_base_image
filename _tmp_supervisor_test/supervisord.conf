[supervisord]
nodaemon=true
user=x
pidfile=/home/x/.run/supervisord.pid
logfile=/home/x/.run/supervisord.log
logfile_maxbytes=10MB
logfile_backups=5
loglevel=info

[unix_http_server]
file=/home/x/.run/supervisor.sock
chmod=0770
chown=x:x

[supervisorctl]
serverurl=unix:///home/x/.run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:test]
command=/bin/sh -c "echo hello-from-child; sleep 30"
user=x
stdout_logfile=/dev/stdout
redirect_stderr=true
autostart=true
autorestart=false
