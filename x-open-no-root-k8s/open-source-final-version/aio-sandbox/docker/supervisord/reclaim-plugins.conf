[program:reclaim-plugins]
command=/bin/sh -c "PATHS='/home/x/projects /home/experts /home/x/plugins /home/x/plugins-version /home/x/.x /home/x/.claude /home/x/.x/LD96.03_XAgent /home/x/.data'; for p in $PATHS; do if [ -d \"$p\" ]; then echo \"=== reclaim: $p ===\"; before=$(stat -c '%%U:%%G %%a' \"$p\" 2>/dev/null || echo unknown); echo \"  before: $before\"; find \"$p\" -type d ! -perm -g+w -exec chmod g+w {} + 2>/dev/null; find \"$p\" -user root -print0 2>/dev/null | xargs -0 -r chown 1000:1000 2>/dev/null; chmod 755 \"$p\" 2>/dev/null; after=$(stat -c '%%U:%%G %%a' \"$p\" 2>/dev/null || echo unknown); echo \"  after:  $after\"; else echo \"=== skip: $p (not mounted) ===\"; fi; done; echo '=== reclaim-plugins: done ==='"
priority=40
autostart=true
autorestart=false
startsecs=0
startretries=1
user=root
stdout_logfile=/proc/1/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/proc/1/fd/2
stderr_logfile_maxbytes=0