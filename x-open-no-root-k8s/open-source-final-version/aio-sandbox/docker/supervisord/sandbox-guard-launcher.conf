[program:sandbox-guard-launcher]
command=/usr/bin/python3 -u /home/x/.daemon/sandbox_guard.py launcher --config /home/x/.daemon/config.json
directory=/home/x/.daemon
priority=60
autostart=true
autorestart=false
startsecs=0
startretries=1
stopsignal=TERM
stopasgroup=true
killasgroup=true
user=x
environment=HOME="/home/x",USER="x",PM2_HOME="/home/x/.pm2",PYTHONUNBUFFERED="1",PYTHONDONTWRITEBYTECODE="1"
# NOTE: /proc/1/fd/1 is root-owned; user=x cannot write to it. Use AUTO so
# supervisord creates a child stdout file descriptor in its own log dir.
stdout_logfile=AUTO
stdout_logfile_maxbytes=0
stderr_logfile=AUTO
stderr_logfile_maxbytes=0
