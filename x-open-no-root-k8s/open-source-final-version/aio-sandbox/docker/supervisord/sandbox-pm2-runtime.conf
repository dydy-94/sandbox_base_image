[program:sandbox-pm2-runtime]
command=/home/x/.npm-global/bin/pm2-runtime --no-auto-exit --raw start /bin/sleep --name sandbox-pm2-anchor --interpreter none --output /dev/null --error /dev/null -- 2147483647
directory=/home/x
priority=50
autostart=true
autorestart=true
startsecs=1
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
user=x
environment=HOME="/home/x",USER="x",PM2_HOME="/home/x/.pm2",PATH="/home/x/.npm-global/bin:/home/x/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
# Route stdout/stderr through /dev/fd/1(/2) so supervisor writes child output
# to the container stdout/stderr pipes (visible via docker logs / kubectl logs).
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
