[program:sandbox-daemon]
command=/usr/bin/python3 -u /home/x/.daemon/sandbox_guard.py daemon --config /home/x/.daemon/config.json
directory=/home/x/.daemon
priority=70
autostart=false
autorestart=true
startsecs=1
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
user=x
environment=HOME="/home/x",USER="x",PM2_HOME="/home/x/.pm2",PYTHONUNBUFFERED="1",PYTHONDONTWRITEBYTECODE="1"
# Route stdout/stderr through /dev/fd/1(/2) so supervisor writes child output
# to the container stdout/stderr pipes (visible via docker logs / kubectl logs).
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
