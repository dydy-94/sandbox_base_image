[program:python-server]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",JUPYTER_PLATFORM_DIRS="1",XAUTHORITY="/home/%(ENV_USER)s/.Xauthority",DISPLAY="%(ENV_DISPLAY)s",PYTHONWARNINGS="ignore",SANDBOX_SRV_PORT="9988",SRV_PYTHONPATH="/opt/server-venv/lib/python3/site-packages",TERM="xterm-256color",DISABLE_JUPYTER="true"
command=/opt/gem/supervisord/python_srv_wrapper.sh --host 127.0.0.1 --port %(ENV_SANDBOX_SRV_PORT)s --ws-ping-interval 30 --mcp-config /opt/gem/mcp-hub.json --filter-mcp-servers sandbox --workspace %(ENV_WORKSPACE)s
autorestart=true
# python-server boots and waits in lifespan (services.initialize + warmup_pools)
# for ~30-60 seconds before uvicorn actually binds the port. The default
# startsecs=1 would cause supervisord to FATAL the program during this
# window. v13-fix5: reduced from 45 to 15 (actual startup ~22s, saves 30s
# of "RUNNING" detection time; K8s readinessProbe sees ready sooner).
startsecs=15
stopwaitsecs=60
priority=100
user=%(ENV_USER)s
stdout_logfile=%(ENV_LOG_DIR)s/python-server.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
redirect_stderr=true
