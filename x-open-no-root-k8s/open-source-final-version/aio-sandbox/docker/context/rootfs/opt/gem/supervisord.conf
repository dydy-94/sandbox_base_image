[supervisord]
nodaemon=true
# ---- non-root: paths must be writable by x (uid 1000) ----
# /var/run is root-owned by default; x cannot create files there.
# Use $HOME/.run/ which Dockerfile pre-creates with chown 1000:1000.
user=x
pidfile=/home/x/.run/supervisord.pid
logfile=/home/x/.run/supervisord.log
logfile_maxbytes=10MB
logfile_backups=5
loglevel=info

[include]
# aio-sandbox OFFLINE build: wildcard include so that runtime-written
# configs (sandbox-daemon.conf, sandbox-guard-launcher.conf written by
# sandbox_guard bootstrap) are automatically picked up by `supervisorctl
# reread`.  Only `browser` (the single Chrome entrypoint) runs, mirroring
# the closed-source Dockerfile topology.
files = /opt/gem/supervisord/*.conf

[unix_http_server]
# socket must be in x-writable directory; 0777 so other container users
# (e.g. root for troubleshooting) can also connect to supervisorctl
file=/home/x/.run/supervisor.sock
chmod=0777
chown=x:x

[supervisorctl]
serverurl=unix:///home/x/.run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface
