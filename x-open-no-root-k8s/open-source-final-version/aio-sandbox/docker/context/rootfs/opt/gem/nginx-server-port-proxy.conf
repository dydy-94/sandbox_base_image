server {
    listen 0.0.0.0:8080;
    listen [::]:8080;
    server_name ~^(?<port>\d+)-(.+)$;

    location = /_sandbox_port_auth {
        internal;
        proxy_pass http://127.0.0.1:18081/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Id-Token $http_id_token;
        proxy_connect_timeout 1s;
        proxy_send_timeout 2s;
        proxy_read_timeout 2s;
    }

    location / {
        if ($sandbox_gateway_origin_allowed = 0) {
            return 403;
        }
        auth_request /_sandbox_port_auth;
        proxy_pass http://127.0.0.1:$port;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Allow websocket connections
        proxy_set_header                        Upgrade           $http_upgrade;
        proxy_set_header                        Connection        "upgrade";
        proxy_set_header Host localhost:$port;
        proxy_set_header Origin http://localhost:$port;
        proxy_set_header Referer http://localhost:$port;

        proxy_set_header X-Request-ID           $http_x_request_id;
        proxy_set_header X-Real-IP              $remote_addr;
        proxy_set_header X-Forwarded-For        $remote_addr;
        proxy_set_header X-Forwarded-Host       $http_host;
        proxy_set_header X-Forwarded-Port       $server_port;
        proxy_set_header X-Forwarded-Proto      $scheme;
        proxy_set_header X-Forwarded-Scheme     $scheme;
        proxy_set_header X-Scheme               $scheme;

        proxy_connect_timeout                   5s;
        proxy_send_timeout                      3600s;
        proxy_read_timeout                      3600s;

        proxy_http_version                      1.1;
    }
}
