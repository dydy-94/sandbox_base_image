location /ws {
    proxy_pass http://127.0.0.1:${WEBSOCKET_PROXY_PORT}/;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /websockify {
    proxy_pass http://127.0.0.1:${WEBSOCKET_PROXY_PORT}/;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# noVNC 1.5+ resolves its `path` setting ("websockify") relative to the page it
# is served from (/vnc/), so the browser opens ws://host/vnc/websockify, not the
# root /websockify. Proxy that to the websocket bridge too — otherwise it falls
# into the static `/vnc/` alias below, 404s, and the client reports close 1006.
location = /vnc/websockify {
    proxy_pass http://127.0.0.1:${WEBSOCKET_PROXY_PORT}/;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /vnc/ws {
    proxy_pass http://127.0.0.1:${WEBSOCKET_PROXY_PORT}/;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 2026-07-21: /vnc/user-websockify/ and /user-websockify/ paths are constructed
# by the closed-source frontend when embedded in an iframe under the
# httpsnginx -> sandbox-model-gw (gateway) chain. The ^~ modifier makes these
# match BEFORE the /vnc/ prefix below (which would otherwise 404 as static).
location ^~ /vnc/user-websockify/ {
    proxy_pass http://127.0.0.1:${WEBSOCKET_PROXY_PORT}/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 5s;
}

location ^~ /user-websockify/ {
    proxy_pass http://127.0.0.1:${WEBSOCKET_PROXY_PORT}/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 5s;
}

location /vnc/ {
    alias /opt/novnc/noVNC/;
    index index.html vnc.html;
}
