location /ws {
    proxy_pass http://127.0.0.1:5700/;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /websockify {
    proxy_pass http://127.0.0.1:5700/;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# /vnc/app/ui.js 单独优先匹配 /opt/novnc/app/ overlay（deploy-time ui.js swap /
# v14 bake 的剪贴板补丁）；其余 /vnc/app/*（localization.js、locale/、styles/
# images/ 等）必须走 baked /opt/novnc/noVNC/app/ —— overlay 目录里只有 ui.js,
# 若整段 /vnc/app/ 都打到 overlay 上, localization.js / locale/*.json 会 404,
# noVNC 直接报 "404 Not Found"（Localizer._setupDictionary）。
location ^~ /vnc/app/ui.js {
    alias /opt/novnc/app/ui.js;
}

location ^~ /vnc/app/ {
    alias /opt/novnc/noVNC/app/;
    index index.html;
}

location /vnc/ {
    alias /opt/novnc/noVNC/;
    index index.html vnc.html;
}
