[program:sandbox-port-auth]
command=/usr/bin/python3 -m port_auth.server
directory=/opt/gem
autostart=true
autorestart=true
startsecs=0
startretries=3
priority=840
user=x
environment=HOME="/home/x",USER="x"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stdout_logfile_backups=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stderr_logfile_backups=0
