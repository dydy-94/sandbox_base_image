[program:browser]
; Visible chrome on the X11 display :99.  This is the chrome the user
; sees through the VNC iframe, and ALSO the chrome that the browser-ui
; panel connects to via CDP — both views point at the same process
; (README §4.4.2).  Runs as x (UID 1000) alongside Xvnc and openbox.
; Mirrors closed-source Dockerfile behavior: one unified chrome process.
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s",GOOGLE_API_KEY="",GTK_IM_MODULE="fcitx",QT_IM_MODULE="fcitx",XMODIFIERS="@im=fcitx",DBUS_SESSION_BUS_ADDRESS="unix:path=%(ENV_AIO_DBUS_SESSION_SOCKET)s"
command=/opt/gem/start-browser.sh
stopsignal=INT
autostart=true
autorestart=true
priority=100
user=%(ENV_USER)s
stdout_logfile=%(ENV_LOG_DIR)s/browser.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
redirect_stderr=true